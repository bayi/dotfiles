workspace = name:T, decorate:false

#windowrule = suppress_event maximize, match:class .* # You'll probably like this.

windowrule {
  name = File-Roller-Rules
  match:class = ^(org.gnome.FileRoller)$
  float = on
  center = on
  size = (monitor_w * 0.5) (monitor_h * 0.75)
}

windowrule {
  name = Steam-Friends-List
  match:class = ^(steam)$
  match:title = ^(Friends List|Barátlista)$
  persistent_size = off
  float = on
}

windowrule {
  name = Steam-Chat-Window
  match:class = ^(steam)$
  match:title = ^(Chat|Csevegés).*
  float = on
  persistent_size = off
  size = (monitor_w * 0.3) (monitor_h * 0.5)
  center = on
}

windowrule {
  name = Anydesk-Window
  match:class = ^(Anydesk)$
  no_blur = on
  allows_input = on
  no_anim = on
}

windowrule {
  name = Firefox
  match:class = ^(firefox)$
  no_blur = on
}

windowrule {
  name = Firefox-PiP-En
  match:class = ^(firefox)$
  match:title = ^(Picture-in-Picture)$
  float = on
  pin = on
  move = (monitor_w * 0.72) (monitor_h * 0.72)
  size = (monitor_w * 0.25) (monitor_h * 0.25)
}

windowrule {
  name = Firefox-PiP-Hu
  match:class = ^(firefox)$
  match:title = ^(Kép a képben)$
  float = on
  pin = on
  move = (monitor_w * 0.72) (monitor_h * 0.72)
  size = (monitor_w * 0.25) (monitor_h * 0.25)
}

